name: Windows installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Lite and Full
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Validate version and tag
        id: version
        shell: pwsh
        run: |
          python tools/prepare_desktop_release.py metadata --release-tag "$env:RELEASE_TAG" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore Nuitka compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~\AppData\Local\Nuitka\Nuitka\Cache
          key: nuitka-windows2022-python311-v1-${{ hashFiles('requirements.txt', 'requirements-build.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-windows2022-python311-v1-${{ hashFiles('requirements.txt', 'requirements-build.txt') }}-

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler not found' }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Compile and package
        shell: pwsh
        run: ./tools/build_desktop.ps1 -ReleaseTag "$env:RELEASE_TAG" -InnoCompiler "$env:INNO_COMPILER"

      - name: Save installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SkyAutoMusic-v${{ steps.version.outputs.version }}-windows
          path: |
            output/windows/installers/*.exe
            output/windows/installers/SHA256SUMS.txt
            output/windows/installers/build-info.json
            output/windows/installers/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-diagnostics
          path: |
            output/windows/compilation-report.xml
            output/windows/build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: SkyAutoMusic-*-windows
          merge-multiple: true
          path: installers

      - name: Verify and publish
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft > release-status.json 2>/dev/null; then
            if [ "$(jq -r '.isDraft' release-status.json)" != true ]; then
              echo 'This version is already published. Use a new version tag instead of replacing its installers.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "SkyAutoMusic $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.exe SHA256SUMS.txt build-info.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
